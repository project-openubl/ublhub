version: "3"

services:
  postgresql:
    image: postgres:13.7
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ublhub_db
      POSTGRES_USER: db_username
      POSTGRES_PASSWORD: db_password
    volumes:
      - ublhub_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U db_username -d ublhub_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ublhub:
    image: samisoft/ublhub:gre-rest-local
    build:
      context: .
      dockerfile: Dockerfile.samisoft
    ports:
      - 8180:8080
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_USERNAME: db_username
      QUARKUS_DATASOURCE_PASSWORD: db_password
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/ublhub_db
      QUARKUS_OIDC_ENABLED: "false"
      OPENUBL_STORAGE_TYPE: filesystem
      OPENUBL_STORAGE_FILESYSTEM.FOLDER: workspace
      OPENUBL_STORAGE_FILESYSTEM_DIRECTORY: workspace
      OPENUBL_SUNAT_GRE_TOKEN_URL: ${UBLHUB_GRE_TOKEN_URL:-https://api-seguridad.sunat.gob.pe/v1/clientessol/{clientId}/oauth2/token/}
    volumes:
      - ublhub_workspace:/deployments/workspace
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/q/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  ublhub_postgresql_data:
  ublhub_workspace:
